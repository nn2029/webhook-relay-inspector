services:
  backend:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      RULES_CONFIG_PATH: /config/forwarding-rules.example.json
    ports:
      - "8000:8000"
    volumes:
      - ./config:/config:ro

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
      VITE_WS_BASE_URL: ws://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

  postgres:
    image: postgres:16-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: webhook
      POSTGRES_PASSWORD: relay
      POSTGRES_DB: webhook_relay
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:

